name: Build & Push Docker Image (M4 Native)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Intel sunucuda ARM imajı paketleyebilmek için bu adım şart
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Sadece M4/Apple Silicon mimarisi
          platforms: linux/arm64
          tags: ghcr.io/vbthub/hackathon2026:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          # k8s/deployment.yaml içindeki imajı yeni hash ile günceller
          sed -i "s|image: ghcr.io/vbthub/hackathon2026:.*|image: ghcr.io/vbthub/hackathon2026:${{ github.sha }}|g" k8s/deployment.yaml
          git add k8s/deployment.yaml
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
          git push
