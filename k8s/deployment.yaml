apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-web
  namespace: default
  labels:
    app: hackathon-web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hackathon-web
  template:
    metadata:
      labels:
        app: hackathon-web
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-login-secret
      containers:
        - name: hackathon-web
          image: ghcr.io/vbthub/hackathon2026:f8cb9d4d8a38d7cc5dbf3993e2019e85f1b2fd7c
          imagePullPolicy: IfNotPresent
          # İSTEDİĞİN AYAR BURADA
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hackathon-web-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: hackathon-web-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hackathon-web-secrets
                  key: ADMIN_TOKEN
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hackathon-web-secrets
                  key: RESEND_API_KEY
            - name: CF_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: hackathon-web-secrets
                  key: CF_ACCOUNT_ID
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: hackathon-web-secrets
                  key: R2_ACCESS_KEY_ID
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hackathon-web-secrets
                  key: R2_SECRET_ACCESS_KEY
            - name: PORT
              value: "3001"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 700m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 8
            periodSeconds: 5
            failureThreshold: 14
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
